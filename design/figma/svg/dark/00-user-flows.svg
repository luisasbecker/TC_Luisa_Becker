roke-width="1.8" marker-end="url(#arrow)"/><path d="M560 810V878" fill="none" stroke="#FFDAD7" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M560 844H926V878" fill="none" stroke="#FFDAD7" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M194 956V1000H560V1040" fill="none" stroke="#FFDAD7" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M560 956V1040" fill="none" stroke="#FFDAD7" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M926 956V1000H560" fill="none" stroke="#FFDAD7" stroke-width="1.8" marker-end="url(#arrow)"/><text x="780" y="985" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0" fill="#FFDAD7" data-token="primary">Não interrompe</text><text x="48" y="1616" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#CFC7C7" data-token="textSecondary">Revisar uma etapa invalida apenas os dados que dependem dela. O histórico preserva as decisões anteriores.</text><text x="48" y="1662" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#AA9C9B" data-token="textMuted">Fluxo demonstrativo. Nenhum modelo real de IA, validação clínica ou retreinamento é executado.</text></svg>