name: pipeline_bucal
description: Protótipo acadêmico com simulação cloud e offline do pipeline de lesões bucais.
publish_to: none
version: 0.3.0+4
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  image: 4.8.0
  image_picker: 1.2.1
  crypto: 3.0.7
  share_plus: 10.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/fonts/OFL-Inter.txt
    - assets/references/manifest.json
    - assets/references/photos/
    - assets/references/quality/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
